<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"><rect width="1400" height="820" fill="#f7f8fa"/><rect width="1400" height="70" fill="#292929"/><text x="30" y="45" font-family="Arial" font-size="24" fill="white">Postman • REST API Testing</text><text x="45" y="120" font-family="Arial" font-size="30" font-weight="bold">TC005 — GET All Posts</text><text x="55" y="175" font-family="monospace" font-size="21">GET  {{baseUrl}}/posts</text><rect x="45" y="210" width="1310" height="390" rx="8" fill="white" stroke="#ddd"/><text x="70" y="260" font-family="Arial" font-size="22" font-weight="bold">Response: 200 OK</text><text x="70" y="310" font-family="monospace" font-size="18">Response body: JSON array of posts</text><text x="70" y="350" font-family="monospace" font-size="18">Array validation: PASS ✓</text><text x="70" y="390" font-family="monospace" font-size="18">Content-Type: application/json</text><text x="70" y="470" font-family="Arial" font-size="20">Test Results: ✓ Status 200   ✓ Array response</text><text x="45" y="755" font-family="Arial" font-size="15" fill="#777">ILLUSTRATIVE PORTFOLIO SCREENSHOT — replace with your actual Postman capture after execution.</text></svg>